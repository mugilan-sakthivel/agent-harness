[project]
name = "agent-harness-backend"
version = "0.1.0"
description = "Reliable deep-agent harness backend (deepagents + LangGraph + Gemini)"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-mcp-adapters>=0.1.0",
    "langgraph-cli[inmem]>=0.2.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_harness"]
